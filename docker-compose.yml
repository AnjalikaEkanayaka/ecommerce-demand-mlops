services:
  api:
    build: .
    image: ecommerce-demand-api:latest
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_RUNTIME_DIR: /runtime
      MLFLOW_TRACKING_URI: sqlite:////runtime/mlflow.db
    volumes:
      - demand-runtime:/runtime

  # Optional viewer of the same SQLite store, not a required tracking server.
  mlflow:
    image: ecommerce-demand-api:latest
    profiles: [tracking]
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - demand-runtime:/runtime
    command:
      - mlflow
      - ui
      - --backend-store-uri
      - sqlite:////runtime/mlflow.db
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"

volumes:
  demand-runtime:
